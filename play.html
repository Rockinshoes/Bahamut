<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bahamut Clone</title>
  <style>
:root {
  --bg: #14161f;
  --panel: #1e2130;
  --panel2: #272b3d;
  --text: #e8eaf2;
  --muted: #8d93ab;
  --accent: #f0b429;
  --good: #3fb56b;

  --r-N: #8d93ab;
  --r-R: #4f9be8;

  --r-SSR: #f0b429;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 15px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
body { display: flex; flex-direction: column; max-width: 640px; margin: 0 auto;
  padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px)); }
button, select { touch-action: manipulation; }

#topbar { display: flex; gap: 10px; padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
  background: var(--panel); align-items: center; justify-content: space-between; flex-wrap: wrap; }
.stat { font-size: 13px; }
.stat .label { color: var(--muted); font-size: 11px; display: block; text-transform: uppercase; letter-spacing: .04em; }

.bar { height: 5px; background: var(--panel2); border-radius: 3px; overflow: hidden; margin-top: 2px; }
.bar > div { height: 100%; background: var(--accent); }
#s-stamina-bar { height: 100%; background: var(--good); width: 0; }

#view { flex: 1; overflow-y: auto; padding: 12px; -webkit-overflow-scrolling: touch; }
#tabs { display: flex; background: var(--panel); padding-bottom: env(safe-area-inset-bottom); }
#tabs button { flex: 1; padding: 14px 4px; background: none; border: 0; color: var(--muted);
  font-size: 14px; border-top: 2px solid transparent; min-height: 48px; }
#tabs button.active { color: var(--accent); border-top-color: var(--accent); }

h2 { margin: 4px 0 10px; font-size: 18px; }
h3 { margin: 14px 0 6px; font-size: 15px; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.spacer { flex: 1; }
.grow { flex: 1; min-width: 0; }

button.btn { background: var(--accent); color: #1a1405; border: 0; border-radius: 8px; padding: 10px 14px;
  font-weight: 700; font-size: 14px; min-height: 42px; }
button.btn.secondary { background: var(--panel2); color: var(--text); }
button.btn.danger { background: var(--bad); color: #fff; }
button.btn:disabled { opacity: .4; }
button.btn.small { padding: 6px 12px; font-size: 13px; min-height: 38px; }
button.btn.big { font-size: 16px; padding: 12px 18px; min-height: 48px; }

.panel { background: var(--panel); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
.panel.pts { border: 1px solid var(--accent); }

/* Quests */
.chapter-title { margin: 16px 0 6px; font-weight: 700; }
.stage { display: flex; align-items: center; gap: 10px; background: var(--panel); border-radius: 10px;
  padding: 10px 12px; margin-bottom: 6px; }
.stage.locked { opacity: .45; }
.stage .name { font-weight: 600; }

.pips { letter-spacing: 3px; color: var(--accent); font-size: 14px; }

.badge.boss { background: var(--bad); color: #fff; }

/* Cards */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.card { position: relative; border-radius: 10px; overflow: hidden; background: var(--panel2);
  border: 2px solid var(--r-N); aspect-ratio: 3 / 4.2; cursor: pointer; }
.card.r-R { border-color: var(--r-R); }
.card.r-SR { border-color: var(--r-SR); }
.card.r-SSR { border-color: var(--r-SSR); box-shadow: 0 0 10px rgba(240, 180, 41, .5); }
.card .art, .bu-card .art { position: absolute; inset: 0; background: #1a1c28; }
.card .art svg, .bu-card .art svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.card .art img, .bu-card .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card .info { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 5px 4px;
  background: linear-gradient(transparent, rgba(0, 0, 0, .85)); font-size: 11px; line-height: 1.2; }
.card .nm { font-weight: 700; }
.card .rar { position: absolute; top: 3px; left: 4px; font-size: 11px; font-weight: 800; color: #fff;
  text-shadow: 0 1px 2px #000; }
.card .lv { position: absolute; top: 3px; right: 4px; font-size: 11px; color: #fff; text-shadow: 0 1px 2px #000; }
.card .evo { color: var(--accent); }
.card .lead { position: absolute; top: 18px; left: 4px; font-size: 10px; font-weight: 800; color: #1a1405;
  background: var(--accent); border-radius: 6px; padding: 0 5px; }
.card .adv { position: absolute; top: 18px; right: 4px; font-size: 12px; font-weight: 800; text-shadow: 0 1px 2px #000; }
.card .adv.up { color: #6dff9d; }
.card .adv.down { color: #ff8a6d; }
.card.selected { outline: 3px solid var(--good); }
.card.dim { opacity: .35; }

/* Deck */
.slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 8px; }
.slot { aspect-ratio: 3 / 4.2; border: 2px dashed var(--panel2); border-radius: 10px; display: flex;
  align-items: center; justify-content: center; color: var(--muted); font-size: 22px; position: relative; }
.slot .card { width: 100%; height: 100%; aspect-ratio: auto; }
.slot .card .info { font-size: 9px; }
.slot .card .stat, .pull-results .card .stat { display: none; }
.slot .star { position: absolute; bottom: -2px; right: -2px; z-index: 3; width: 30px; height: 30px; border-radius: 15px;
  border: 0; background: var(--panel2); color: var(--accent); font-size: 15px; line-height: 1; }
.cost-ok { color: var(--good); }
.cost-over { color: var(--bad); }

/* Modal / toast */
#modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .7); display: flex;
  align-items: flex-end; justify-content: center; z-index: 30; }
#modal-backdrop[hidden], #toast[hidden], #screen[hidden] { display: none; }
#modal { background: var(--panel); width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto;
  border-radius: 16px 16px 0 0; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
#toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: #000;
  color: #fff; padding: 10px 16px; border-radius: 20px; z-index: 40; max-width: 90%; text-align: center; }
.result-win { color: var(--good); }
.result-lose { color: var(--bad); }
.pull-results { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 10px 0; }
.pull-results .card .info { font-size: 9px; }
textarea { width: 100%; min-height: 90px; background: #0e1018; color: var(--text); border: 1px solid var(--panel2);
  border-radius: 8px; padding: 8px; font-family: monospace; font-size: 12px; }
table.rates { border-collapse: collapse; font-size: 13px; }
table.rates td { padding: 2px 12px 2px 0; }

/* ---------- Full-screen overlay: party select, battle, results ---------- */
#screen { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column;
  max-width: 640px; margin: 0 auto;
  padding: env(safe-area-inset-top) env(safe-area-inset-left) env(safe-area-inset-bottom) env(safe-area-inset-right); }
.sc-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--panel); }
.sc-head h2 { margin: 0; font-size: 16px; }
.sc-body { flex: 1; overflow-y: auto; padding: 12px; -webkit-overflow-scrolling: touch; }
.sc-foot { display: flex; gap: 8px; padding: 10px 12px; background: var(--panel); }
.sc-foot .btn { flex: 1; }

/* Mini unit cards (party screen enemy preview) */
.foes { display: flex; gap: 8px; justify-content: center; margin: 4px 0 8px; }
.foe { width: 22%; max-width: 92px; min-width: 0; }
.foe .bu-card { position: relative; width: 100%; aspect-ratio: 3 / 4.2; }

/* Battle units */
.bu { flex: 1 1 0; min-width: 0; max-width: 98px; position: relative; }
.bu[data-side="e"] { max-width: 128px; }
.bu.boss { max-width: 168px; flex-grow: 1.5; }
.bu-card { position: relative; width: 100%; aspect-ratio: 3 / 4.2; border-radius: 8px; overflow: hidden;
  border: 2px solid var(--r-N); background: #1a1c28; transition: transform .16s ease-out, filter .3s, opacity .4s; }
.bu-card.r-R { border-color: var(--r-R); }
.bu-card.r-SR { border-color: var(--r-SR); }
.bu-card.r-SSR { border-color: var(--r-SSR); box-shadow: 0 0 10px rgba(240, 180, 41, .5); }
.bu-el { position: absolute; top: 2px; left: 3px; font-size: 13px; text-shadow: 0 1px 3px #000; z-index: 2; }
.bu-lead { position: absolute; top: 2px; right: 3px; font-size: 12px; color: var(--accent); text-shadow: 0 1px 3px #000; z-index: 2; }
.bu-name { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 3px 2px; font-size: 9px; font-weight: 700; line-height: 1.1;
  text-align: center; background: linear-gradient(transparent, rgba(0, 0, 0, .85)); z-index: 2; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.hpbar { height: 6px; background: #000; border-radius: 3px; overflow: hidden; margin-top: 3px; border: 1px solid #333; }
.hpbar i { display: block; height: 100%; width: 100%; background: var(--good); transition: width .3s ease-out; }
.bu.mid .hpbar i { background: #e8c547; }
.bu.low .hpbar i { background: var(--bad); }
.hpnum { font-size: 10px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.bu.hit .bu-card { animation: shake .26s linear; }
.bu.hit .bu-card::after { content: ""; position: absolute; inset: 0; background: #fff; opacity: .55; animation: flash .26s forwards; z-index: 3; }
.bu.dead .bu-card { filter: grayscale(1) brightness(.45); opacity: .5; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes flash { to { opacity: 0; } }

.battle { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.b-top { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--panel); }
.b-top .round { font-weight: 700; flex: 1; }
.b-top button { background: var(--panel2); color: var(--text); border: 0; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 700; min-height: 38px; }
.b-top button.on { background: var(--accent); color: #1a1405; }
.b-field { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: space-between;
  padding: 14px 10px; min-height: 0; overflow: hidden;
  background: radial-gradient(ellipse at 50% 40%, var(--field, #2a2f48) 0%, #10121b 75%); }
.b-row { display: flex; gap: 6px; justify-content: center; align-items: flex-start; }
.b-mid { text-align: center; color: var(--muted); font-size: 13px; min-height: 22px; letter-spacing: .08em; text-transform: uppercase; }
.dmg { position: absolute; z-index: 10; font-weight: 900; font-size: 22px; color: #fff; pointer-events: none;
  text-shadow: 0 2px 4px #000, 0 0 8px rgba(255, 255, 255, .4); transform: translate(-50%, -50%); animation: floatUp .9s ease-out forwards; }
.dmg.strong { color: #ffe36a; font-size: 28px; }
.dmg.weak { color: #b9bfd6; font-size: 17px; }
@keyframes floatUp { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -48px; } }
.b-log { padding: 8px 12px; background: var(--panel); font-size: 12px; color: var(--muted); min-height: 34px; text-align: center; }

/* Results */
.res-title { text-align: center; font-size: 26px; font-weight: 800; margin: 6px 0 4px; letter-spacing: .04em; }
.res-sub { text-align: center; color: var(--muted); margin-bottom: 12px; }
.reward { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--panel2); }
.reward:last-child { border-bottom: 0; }
.chest { text-align: center; }
.chest svg { width: 72px; height: 60px; display: block; margin: 0 auto 4px; }
.found { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.found .card { width: 96px; flex: none; }
.levelup { text-align: center; color: var(--accent); font-weight: 800; margin: 8px 0; }

@media (prefers-reduced-motion: reduce) {
  .bu.hit .bu-card, .dmg { animation-duration: .01s; }
}

/* Factions and the alignment picker */
.fx { font-weight: 700; }
.align-pick { display: flex; gap: 12px; align-items: center; }
.align-art { width: 84px; flex: none; }
</style>

<body>
  <header id="topbar">
    <div class="stat"><span class="label">Lv</span> <b id="s-level">1</b></div>
    <div class="stat stamina">
      <span class="label">Stamina</span> <b id="s-stamina">0/0</b>
      <div class="bar"><div id="s-stamina-bar"></div></div>
      <small id="s-stamina-timer"></small>
    </div>
    <div class="stat"><span class="label">Gems</span> <b id="s-gems">0</b></div>
    <div class="stat"><span class="label">Gold</span> <b id="s-gold">0</b></div>
  </header>

  <main id="view"></main>

  <nav id="tabs">
    <button data-tab="quests" class="active">Quests</button>
    <button data-tab="cards">Cards</button>
    <button data-tab="deck">Deck</button>
    <button data-tab="summon">Summon</button>
    <button data-tab="more">More</button>
  </nav>

  <div id="screen" hidden></div>
  <div id="modal-backdrop" hidden>
    <div id="modal" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toast" hidden></div>

  <script>
/*
 * data.js - all the game's content: factions, rarities, cards, chapters.
 * Edit this file to add cards or change balance. No other file needs to change
 * when you add a card (just add a line to the CARD_LIST below).
 *
 * Art: the game draws placeholder art for every card automatically (js/art.js).
 * To use your own, put an image at  assets/cards/<card-id>.png  and it replaces
 * the placeholder.
 */
var GameData = (function () {
  'use strict';

  // Three factions, like the original's Man / God / Demon. There is no damage weakness
  // between them. Each leans a different way, and cards matching the alignment you
  // picked at the start get a bonus (CONFIG.alignmentBonus).
  var FACTIONS = {
    mortal:   { name: 'Mortal',   icon: '⚔', color: '#5fbf7f', atkMod: 1.0,  hpMod: 1.0,  costMod: -1,
                blurb: 'Balanced fighters. Cost 1 less in your party.' },
    immortal: { name: 'Immortal', icon: '✦', color: '#f0c75e', atkMod: 0.85, hpMod: 1.25, costMod: 0,
                blurb: 'The toughest cards. High HP, lower ATK.' },
    fallen:   { name: 'Fallen',   icon: '☠', color: '#c05bd6', atkMod: 1.25, hpMod: 0.85, costMod: 0,
                blurb: 'The hardest hitters. High ATK, lower HP.' }
  };
  var FACTION_ORDER = ['mortal', 'immortal', 'fallen'];

  // rate = percent chance per summon. cost = deck cost. fuseExp = exp this card gives when fused.
  var RARITIES = {
    N:   { name: 'Normal',     rate: 50, cost: 3,  atk: 20, hp: 100, fuseExp: 20,  sell: 20  },
    R:   { name: 'Rare',       rate: 33, cost: 5,  atk: 32, hp: 150, fuseExp: 45,  sell: 50  },
    SR:  { name: 'Super Rare', rate: 13, cost: 8,  atk: 50, hp: 230, fuseExp: 100, sell: 120 },
    SSR: { name: 'Legendary',  rate: 4,  cost: 12, atk: 80, hp: 360, fuseExp: 220, sell: 300 }
  };
  var RARITY_ORDER = ['N', 'R', 'SR', 'SSR'];

  // [id, name, faction, rarity, art style, art look]
  // Art styles: sprite, archer, knight, mage, beast, dragon, seraph, tyrant
  // Art looks (color scene only, no effect on play): fire, water, wind, light, dark
  var CARD_LIST = [
    ['dawn-acolyte',      'Dawn Acolyte',      'mortal',   'N',   'sprite', 'light'],
    ['breeze-pixie',      'Breeze Pixie',      'mortal',   'N',   'sprite', 'wind'],
    ['cinder-archer',     'Cinder Archer',     'mortal',   'R',   'archer', 'fire'],
    ['reed-skirmisher',   'Reed Skirmisher',   'mortal',   'R',   'archer', 'wind'],
    ['sunblade-paladin',  'Sunblade Paladin',  'mortal',   'R',   'knight', 'light'],
    ['storm-falconer',    'Storm Falconer',    'mortal',   'R',   'beast',  'wind'],
    ['flame-warden',      'Flame Warden',      'mortal',   'SR',  'knight', 'fire'],
    ['tempest-leviathan', 'Tempest Leviathan', 'mortal',   'SSR', 'dragon', 'water'],

    ['brook-sprite',      'Brook Sprite',      'immortal', 'N',   'sprite', 'water'],
    ['lantern-cleric',    'Lantern Cleric',    'immortal', 'R',   'mage',   'light'],
    ['tide-caller',       'Tide Caller',       'immortal', 'R',   'mage',   'water'],
    ['frost-sentinel',    'Frost Sentinel',    'immortal', 'R',   'beast',  'water'],
    ['halo-seraph',       'Halo Seraph',       'immortal', 'SR',  'seraph', 'light'],
    ['cyclone-dancer',    'Cyclone Dancer',    'immortal', 'SR',  'mage',   'wind'],
    ['radiant-archon',    'Radiant Archon',    'immortal', 'SSR', 'seraph', 'light'],
    ['skyfather-zephyr',  'Skyfather Zephyr',  'immortal', 'SSR', 'seraph', 'wind'],

    ['ember-imp',         'Ember Imp',         'fallen',   'N',   'sprite', 'fire'],
    ['shade-whelp',       'Shade Whelp',       'fallen',   'N',   'sprite', 'dark'],
    ['ashen-duelist',     'Ashen Duelist',     'fallen',   'R',   'knight', 'fire'],
    ['gloom-thief',       'Gloom Thief',       'fallen',   'R',   'archer', 'dark'],
    ['hollow-reaver',     'Hollow Reaver',     'fallen',   'R',   'knight', 'dark'],
    ['night-sorceress',   'Night Sorceress',   'fallen',   'SR',  'mage',   'dark'],
    ['abyss-knight',      'Abyss Knight',      'fallen',   'SR',  'tyrant', 'water'],
    ['pyre-sovereign',    'Pyre Sovereign',    'fallen',   'SSR', 'dragon', 'fire'],
    ['void-tyrant',       'Void Tyrant',       'fallen',   'SSR', 'tyrant', 'dark']
  ];

  var CARDS = CARD_LIST.map(function (c) {
    var r = RARITIES[c[3]];
    var f = FACTIONS[c[2]];
    return {
      id: c[0],
      name: c[1],
      faction: c[2],
      rarity: c[3],
      style: c[4],
      look: c[5],
      atk: Math.round(r.atk * f.atkMod),
      hp: Math.round(r.hp * f.hpMod),
      cost: r.cost + f.costMod
    };
  });
  var CARD_BY_ID = {};
  CARDS.forEach(function (c) { CARD_BY_ID[c.id] = c; });

  // Quests. Each chapter has 5 sections. Sections 1-4: beat 3 monsters, then a treasure
  // chest opens. Section 5 is the chapter boss. Every enemy in a chapter is of that
  // chapter's faction (which changes their ATK/HP the same way it does for cards).
  // dropWeights = chance weights for the card dropped from chests and boss battles.
  var CHAPTERS = [
    { id: 1, name: 'The Verdant Frontier', faction: 'mortal', look: 'wind',
      enemies: [{ name: 'Thornback Boar', style: 'beast' }, { name: 'Moss Brigand', style: 'archer' },
                { name: 'Wild Gale Hawk', style: 'beast' }, { name: 'Bramble Witch', style: 'mage' }],
      boss: { name: 'Elder Treant', style: 'tyrant' },
      dropWeights: { N: 70, R: 27, SR: 3, SSR: 0 } },
    { id: 2, name: 'Cinder Peaks', faction: 'fallen', look: 'fire',
      enemies: [{ name: 'Magma Crawler', style: 'beast' }, { name: 'Ash Raider', style: 'knight' },
                { name: 'Smoldering Wisp', style: 'sprite' }, { name: 'Slag Golem', style: 'tyrant' }],
      boss: { name: 'Caldera Drake', style: 'dragon' },
      dropWeights: { N: 40, R: 45, SR: 14, SSR: 1 } },
    { id: 3, name: 'The Hollow Sanctum', faction: 'immortal', look: 'dark',
      enemies: [{ name: 'Grave Warden', style: 'knight' }, { name: 'Dusk Stalker', style: 'beast' },
                { name: 'Hollow Priest', style: 'mage' }, { name: 'Wailing Shade', style: 'sprite' }],
      boss: { name: 'The Pale Regent', style: 'seraph' },
      dropWeights: { N: 20, R: 45, SR: 30, SSR: 5 } }
  ];
  var STAGES_PER_CHAPTER = 5;

  // Balance knobs - change these to make the game easier or harder.
  var CONFIG = {
    startGems: 1000,
    startGold: 500,
    singlePullCost: 30,
    tenPullCost: 270,
    staminaRegenMs: 60 * 1000,       // 1 stamina per minute
    maxDeckSize: 5,
    maxEvo: 2,
    fuseGoldPerMaterial: 40,
    evolveGoldBase: 500,             // multiplied by (current evo + 1)
    firstClearGems: 30,
    firstClearBossGems: 100,
    battleMaxRounds: 40,
    monstersPerSection: 3,           // monsters to beat before the chest opens
    monsterDropChance: 0.2,          // chance a defeated monster drops a card
    chestCardChance: 0.75,           // chance the chest holds a card (otherwise extra gold)
    leaderMult: 1.2,                 // the first card in your party is the leader: +20% ATK and HP
    alignmentBonus: 1.15,            // cards matching your alignment: +15% ATK and HP
    sameFactionFuseMult: 1.5,        // fusing a card of the same faction gives 1.5x exp
    pointsPerLevel: 3,               // attribute points you get on each level-up
    staminaPerPoint: 2,              // each Stamina point: +2 max stamina
    atkPctPerPoint: 2,               // each ATK PWR point: +2% team ATK
    hpPctPerPoint: 2,                // each DEF PWR point: +2% team HP
    // Starting cards depend on the alignment you pick.

  <script>
/*
 * game.js - the game rules. No buttons or screens in here, just logic, so it
 * can be tested from the command line (see tests/game.test.js).
 *
 * All the "do something" functions return { ok: true, ... } or { ok: false, error: '...' }.
 * The game state is a plain object that can be saved as JSON.
 */
var Game = (function () {
  'use strict';

  var D = (typeof GameData !== 'undefined') ? GameData : require('./data.js');
  var CFG = D.CONFIG;
  var SAVE_KEY = 'bahamut-clone-save-v1';

  // ---------- small helpers ----------
  function rollWeighted(weights, rand) {
    var total = 0, k;
    for (k in weights) { total += weights[k]; }
    var roll = rand() * total;
    for (k in weights) {
      if (roll < weights[k]) { return k; }
      roll -= weights[k];
    }
    // Floating point edge case: return the last key with weight > 0.
    var last = null;
    for (k in weights) { if (weights[k] > 0) { last = k; } }
    return last;
  }

  function pickCardOfRarity(rarity, rand) {
    var pool = D.CARDS.filter(function (c) { return c.rarity === rarity; });
    return pool[Math.floor(rand() * pool.length)];
  }

  function nowMs(now) { return (typeof now === 'number') ? now : Date.now(); }

  // ---------- player progression ----------
  function maxStamina(level, bonus) { return Math.min(100, 20 + 2 * (level - 1) + (bonus || 0)); }
  function staminaCap(state) { return maxStamina(state.level, state.attr.stamina * CFG.staminaPerPoint); }
  function expToNext(level) { return 60 * level; }
  function deckCostCap(level) { return 24 + 2 * level; }

  // ---------- card stats ----------
  function maxLevel(card) { return 20 + 10 * card.evo; }
  function cardExpToNext(card) { return 30 * card.level; }

  function cardStats(card) {
    var def = D.CARD_BY_ID[card.cardId];
    var mult = (1 + 0.1 * (card.level - 1)) * (1 + 0.3 * card.evo);
    return {
      atk: Math.round(def.atk * mult),
      hp: Math.round(def.hp * mult),
      cost: def.cost,
      maxLevel: maxLevel(card)
    };
  }

  // ---------- state ----------
  function addCard(state, cardId) {
    var card = { uid: state.nextUid++, cardId: cardId, level: 1, exp: 0, evo: 0 };
    state.cards.push(card);
    return card;
  }

  function newGame(opts) {
    opts = opts || {};
    var t = nowMs(opts.now);
    var state = {
      version: 3,
      alignment: D.FACTIONS[opts.alignment] ? opts.alignment : null,  // picked once at the start
      gems: CFG.startGems,
      gold: CFG.startGold,
      level: 1,
      exp: 0,
      stamina: maxStamina(1),
      staminaAt: t,
      nextUid: 1,
      cards: [],
      deck: [],
      cleared: {},          // section id -> true once the section has been cleared
      progress: {},         // section id -> total monsters beaten there
      attr: { stamina: 0, atk: 0, hp: 0 },
      attrPoints: 0,
      items: { cureWater: 0 },
      pulls: 0
    };
    (CFG.starterCards[state.alignment] || CFG.starterCards.mortal).forEach(function (id) {
      var c = addCard(state, id);
      state.deck.push(c.uid);
    });
    return state;
  }

  function findCard(state, uid) {
    for (var i = 0; i < state.cards.length; i++) {
      if (state.cards[i].uid === uid) { return state.cards[i]; }
    }
    return null;
  }

  function regenStamina(state, now) {
    var t = nowMs(now);
    var max = staminaCap(state);
    if (state.stamina >= max) { state.staminaAt = t; return state; }
    var gained = Math.floor((t - state.staminaAt) / CFG.staminaRegenMs);
    if (gained > 0) {
      state.stamina = Math.min(max, state.stamina + gained);
      state.staminaAt += gained * CFG.staminaRegenMs;
      if (state.stamina >= max) { state.staminaAt = t; }

    return state;
  }

  function msUntilNextStamina(state, now) {
    if (state.stamina >= staminaCap(state)) { return 0; }
    return Math.max(0, CFG.staminaRegenMs - (nowMs(now) - state.staminaAt));
  }

  // ---------- attribute points and items ----------
  function spendPoint(state, kind) {
    if (!state.attr.hasOwnProperty(kind)) { return { ok: false, error: 'Unknown attribute.' }; }
    if (state.attrPoints < 1) { return { ok: false, error: 'No attribute points to spend.' }; }
    state.attrPoints--;
    state.attr[kind]++;
    if (kind === 'stamina') { state.stamina += CFG.staminaPerPoint; }
    return { ok: true };
  }

  function useCureWater(state) {
    if (state.items.cureWater < 1) { return { ok: false, error: 'You have no Cure Water.' }; }
    if (state.stamina >= staminaCap(state)) { return { ok: false, error: 'Your stamina is already full.' }; }
    state.items.cureWater--;
    state.stamina = staminaCap(state);
    return { ok: true };
  }

  function setAlignment(state, faction) {
    if (!D.FACTIONS[faction]) { return { ok: false, error: 'Unknown alignment.' }; }
    state.alignment = faction;
    return { ok: true };
  }

  function teamBonus(state) {

      hp: 1 + state.attr.hp * CFG.hpPctPerPoint / 100

  }

  // ---------- summoning (gacha) ----------
  function rateTable() {
    var t = {};
    D.RARITY_ORDER.forEach(function (r) { t[r] = D.RARITIES[r].rate; });
    return t;
  }

  function summon(state, count, rand) {
    rand = rand || Math.random;
    var cost = (count === 10) ? CFG.tenPullCost : CFG.singlePullCost;
    if (count !== 1 && count !== 10) { return { ok: false, error: 'Summon 1 or 10 at a time.' }; }
    if (state.gems < cost) { return { ok: false, error: 'Not enough gems (need ' + cost + ').' }; }
    state.gems -= cost;

    var rarities = [];
    for (var i = 0; i < count; i++) { rarities.push(rollWeighted(rateTable(), rand)); }
    // A 10-summon always includes at least one Super Rare or better.
    if (count === 10 && !rarities.some(function (r) { return r === 'SR' || r === 'SSR'; })) {
      rarities[9] = rollWeighted({ SR: D.RARITIES.SR.rate, SSR: D.RARITIES.SSR.rate }, rand);
    }
    var got = rarities.map(function (r) {
      var def = pickCardOfRarity(r, rand);

  // ---------- deck ----------
  function deckCost(state, uids) {
    return uids.reduce(function (sum, uid) {
      var c = findCard(state, uid);
      return sum + (c ? D.CARD_BY_ID[c.cardId].cost : 0);

  }

  function setDeck(state, uids) {
    if (uids.length > CFG.maxDeckSize) { return { ok: false, error: 'A deck holds at most ' + CFG.maxDeckSize + ' cards.' }; }

      if (seen[uids[i]]) { return { ok: false, error: 'Duplicate card in deck.' }; }
      seen[uids[i]] = true;
    }
    var cost = deckCost(state, uids);
    var cap = deckCostCap(state.level);
    if (cost > cap) { return { ok: false, error: 'Deck cost ' + cost + ' is over your limit of ' + cap + '.' }; }

  // The strongest legal party, by raw power.
  function bestDeck(state) {

  }

  // ---------- fusion, evolution, selling ----------
  function fuseValue(material, base) {
    var def = D.CARD_BY_ID[material.cardId];
    var baseDef = D.CARD_BY_ID[base.cardId];
    var value = D.RARITIES[def.rarity].fuseExp * (1 + 0.2 * (material.level - 1)) * (1 + 0.5 * material.evo);
    if (def.faction === baseDef.faction) { value *= CFG.sameFactionFuseMult; }

  }

  function checkMaterials(state, baseUid, materialUids) {
    var base = findCard(state, baseUid);
    if (!base) { return { ok: false, error: 'Card not found.' }; }
    if (!materialUids.length) { return { ok: false, error: 'Pick at least one card to use.' }; }
    var seen = {};
    for (var i = 0; i < materialUids.length; i++) {
      var uid = materialUids[i];
      if (uid === baseUid) { return { ok: false, error: 'A card cannot be used on itself.' }; }
      if (seen[uid]) { return { ok: false, error: 'Duplicate card selected.' }; }
      seen[uid] = true;
      if (!findCard(state, uid)) { return { ok: false, error: 'Card not found.' }; }
      if (state.deck.indexOf(uid) !== -1) { return { ok: false, error: 'Remove cards from your deck before using them up.' }; }
    }
    return { ok: true, base: base };
  }

  function removeCards(state, uids) {
    state.cards = state.cards.filter(function (c) { return uids.indexOf(c.uid) === -1; });
    state.deck = state.deck.filter(function (uid) { return uids.indexOf(uid) === -1; });
  }

  function fusePreview(state, baseUid, materialUids) {
    var base = findCard(state, baseUid);
    if (!base) { return { exp: 0, gold: 0 }; }
    var exp = 0;
    materialUids.forEach(function (uid) {

  function fuse(state, baseUid, materialUids) {
    var chk = checkMaterials(state, baseUid, materialUids);
    if (!chk.ok) { return chk; }
    var base = chk.base;
    if (base.level >= maxLevel(base)) { return { ok: false, error: 'Already at max level. Evolve it to raise the cap.' }; }
    var preview = fusePreview(state, baseUid, materialUids);
    if (state.gold < preview.gold) { return { ok: false, error: 'Not enough gold (need ' + preview.gold + ').' }; }

    var left = preview.exp;

      else { base.exp += left; left = 0; }

  function canEvolve(state, uid) {

  // Evolution consumes one other copy of the same card (not in the deck).

    if (mat.cardId !== card.cardId) { return { ok: false, error: 'Material must be the same card.' }; }

  function sellValue(card) {

  }

  function sell(state, uids) {
    if (!uids.length) { return { ok: false, error: 'Pick at least one card to sell.' }; }
    var total = 0;
    for (var i = 0; i < uids.length; i++) {
      var c = findCard(state, uids[i]);
      if (!c) { return { ok: false, error: 'Card not found.' }; }
      if (state.deck.indexOf(c.uid) !== -1) { return { ok: false, error: 'Remove cards from your deck before selling them.' }; }
      total += sellValue(c);

    removeCards(state, uids);

  function stageList() {

    D.CHAPTERS.forEach(function (ch) {

        list.push({

          boss: boss,
          monsters: boss ? 1 : CFG.monstersPerSection,

  function getStage(id) {
    for (var i = 0; i < STAGES.length; i++) { if (STAGES[i].id === id) { return STAGES[i]; } }
    return null;
  }

  function isUnlocked(state, stageId) {

    if (!st) { return false; }

    return count % st.monsters;

        style: def.style,

    }

  }

  // Turns your party cards into battle units. The first card is the leader, and cards
  // matching your alignment get the alignment bonus.
  function buildTeam(state, uids) {
    var bonus = teamBonus(state);
    return uids.map(function (uid, i) {
      var c = findCard(state, uid);
      var def = D.CARD_BY_ID[c.cardId];
      var s = cardStats(c);
      var lead = (i === 0) ? CFG.leaderMult : 1;
      var aligned = def.faction === state.alignment;
      var align = aligned ? CFG.alignmentBonus : 1;
      var hp = Math.round(s.hp * lead * align * bonus.hp);
      return {
        name: def.name, faction: def.faction, look: def.look, cardId: def.id, rarity: def.rarity, style: def.style,
        level: c.level, evo: c.evo, leader: i === 0, aligned: aligned,
        atk: Math.round(s.atk * lead * align * bonus.atk), hp: hp, maxHp: hp

        if (t.length) { act(u, 'p', playerUnits, t, enemyUnits); }
      });
      alive(enemyUnits).forEach(function (u) {
        var t = alive(playerUnits);
        if (t.length) { act(u, 'e', enemyUnits, t, playerUnits); }
      });
    }
    var win = alive(enemyUnits).length === 0 && alive(playerUnits).length > 0;
    events.push({ t: 'end', win: win });
    return { win: win, rounds: rounds, log: log, events: events };
  }

  function addPlayerExp(state, amount) {
    var levelsGained = 0;
    state.exp += amount;
    while (state.exp >= expToNext(state.level)) {
      state.exp -= expToNext(state.level);
      state.level++;
      levelsGained++;
      state.attrPoints += CFG.pointsPerLevel;
      state.stamina = staminaCap(state); // level-up refills stamina
      state.gems += 20;
    }
    return levelsGained;
  }

  function dropCard(state, stage, rand) {
    var ch = D.CHAPTERS[stage.chapter - 1];
    var def = pickCardOfRarity(rollWeighted(ch.dropWeights, rand), rand);
    return addCard(state, def.id);
  }

  // What the party-select screen needs to know about the next battle in a section.
  function battleInfo(state, stageId) {
    var stage = getStage(stageId);
    if (!stage) { return { ok: false, error: 'Unknown stage.' }; }
    if (!isUnlocked(state, stageId)) { return { ok: false, error: 'Clear the previous section first.' }; }
    var fightNo = nextFightNo(state, stageId);
    return { ok: true, stage: stage, fightNo: fightNo, monsters: stage.monsters, enemies: stageEnemies(stage, fightNo) };
  }

  // Fight the next monster (or boss) of a section. Pass opts.deck to choose the party.
  // The result is applied right away; result.events is what the battle screen replays.
  function fight(state, stageId, opts) {
    opts = opts || {};
    var rand = opts.rand || Math.random;
    var info = battleInfo(state, stageId);
    if (!info.ok) { return info; }
    var stage = info.stage;
    if (opts.deck) {
      var set = setDeck(state, opts.deck);
      if (!set.ok) { return set; }
    }
    if (!state.deck.length) { return { ok: false, error: 'Your party is empty. Add cards first.' }; }
    regenStamina(state, opts.now);
    if (state.stamina < stage.staminaCost) { return { ok: false, error: 'Not enough stamina (need ' + stage.staminaCost + ').' }; }

    var team = buildTeam(state, state.deck);
    var enemies = info.enemies;
    var units = { player: snapshot(team), enemy: snapshot(enemies) };
    var sim = simulateBattle(team, enemies, rand);
    var out = {
      ok: true, win: sim.win, rounds: sim.rounds, log: sim.log, events: sim.events,
      units: units, stage: stage, fightNo: info.fightNo, monsters: info.monsters
    };
    if (!sim.win) { return out; } // a loss costs nothing

    // Spend stamina only on a win.
    if (state.stamina >= staminaCap(state)) { state.staminaAt = nowMs(opts.now); }
    state.stamina -= stage.staminaCost;

    var gi = stage.index;
    var rewards = {
      exp: stage.staminaCost * 5,
      gold: stage.boss ? 150 + 60 * gi : 12 + 6 * gi,
      gems: 0, cards: [], chest: false, chestGold: 0, cureWater: 0,
      levelsGained: 0, firstClear: false, sectionCleared: false
    };

    state.progress[stage.id] = (state.progress[stage.id] || 0) + 1;
    var count = state.progress[stage.id];
    var wasCleared = !!state.cleared[stage.id];

    // Normal monsters sometimes drop a card.
    if (!stage.boss && rand() < CFG.monsterDropChance) { rewards.cards.push(dropCard(state, stage, rand)); }

    // Every 3rd monster opens a treasure chest; the boss always does.
    if (count % stage.monsters === 0) {
      rewards.chest = true;
      if (stage.boss) {
        rewards.cards.push(dropCard(state, stage, rand));
        rewards.cureWater = 1;
      } else {
        rewards.chestGold = 40 + 20 * gi;
        if (rand() < CFG.chestCardChance) { rewards.cards.push(dropCard(state, stage, rand)); }
      }
    }
    if (count >= stage.monsters && !wasCleared) {
      state.cleared[stage.id] = true;
      rewards.sectionCleared = true;
      rewards.firstClear = true;
      rewards.gems = stage.boss ? CFG.firstClearBossGems : CFG.firstClearGems;
    }

    state.gold += rewards.gold + rewards.chestGold;
    state.gems += rewards.gems;
    state.items.cureWater += rewards.cureWater;
    rewards.levelsGained = addPlayerExp(state, rewards.exp);
    out.rewards = rewards;
    out.progress = sectionProgress(state, stage.id);
    out.cleared = !!state.cleared[stage.id];
    return out;
  }

  // ---------- saving ----------
  function serialize(state) { return JSON.stringify(state); }

  function deserialize(text) {
    var s;
    try { s = JSON.parse(text); } catch (e) { return null; }
    if (!s || typeof s !== 'object' || !Array.isArray(s.cards) || !Array.isArray(s.deck)) { return null; }
    var base = newGame({ now: 0 });
    var out = {};
    for (var k in base) { out[k] = (s[k] !== undefined) ? s[k] : base[k]; }
    // Drop cards the game no longer knows about.
    out.cards = out.cards.filter(function (c) {
      return c && D.CARD_BY_ID[c.cardId] && typeof c.uid === 'number';
    });
    var uids = out.cards.map(function (c) { return c.uid; });
    out.deck = out.deck.filter(function (u) { return uids.indexOf(u) !== -1; }).slice(0, CFG.maxDeckSize);
    var maxUid = 0;
    out.cards.forEach(function (c) { if (c.uid > maxUid) { maxUid = c.uid; } });
    out.nextUid = Math.max(out.nextUid, maxUid + 1);
    ['gems', 'gold', 'level', 'exp', 'stamina', 'staminaAt', 'pulls', 'attrPoints'].forEach(function (key) {
      if (typeof out[key] !== 'number' || !isFinite(out[key])) { out[key] = base[key]; }
    });
    ['cleared', 'progress', 'attr', 'items'].forEach(function (key) {
      if (!out[key] || typeof out[key] !== 'object' || Array.isArray(out[key])) { out[key] = base[key]; }
    });
    ['stamina', 'atk', 'hp'].forEach(function (key) {
      if (typeof out.attr[key] !== 'number' || !isFinite(out.attr[key])) { out.attr[key] = 0; }
    });
    if (typeof out.items.cureWater !== 'number' || !isFinite(out.items.cureWater)) { out.items.cureWater = 0; }
    if (!D.FACTIONS[out.alignment]) { out.alignment = null; } // old saves: the game asks for one
    out.version = 3;
    out.level = Math.max(1, Math.floor(out.level));
    return out;
  }

  var api = {
    SAVE_KEY: SAVE_KEY, STAGES: STAGES,
    newGame: newGame, findCard: findCard, addCard: addCard,
    maxStamina: maxStamina, staminaCap: staminaCap, expToNext: expToNext, deckCostCap: deckCostCap,
    regenStamina: regenStamina, msUntilNextStamina: msUntilNextStamina,
    spendPoint: spendPoint, useCureWater: useCureWater, teamBonus: teamBonus, setAlignment: setAlignment,
    cardStats: cardStats, maxLevel: maxLevel, cardExpToNext: cardExpToNext,
    rateTable: rateTable, summon: summon,
    deckCost: deckCost, setDeck: setDeck, bestDeck: bestDeck,
    fusePreview: fusePreview, fuse: fuse, evolveCost: evolveCost, canEvolve: canEvolve, evolve: evolve,
    sellValue: sellValue, sell: sell,
    getStage: getStage, isUnlocked: isUnlocked, stageEnemies: stageEnemies,
    sectionProgress: sectionProgress, nextFightNo: nextFightNo, battleInfo: battleInfo,
    buildTeam: buildTeam, simulateBattle: simulateBattle, fight: fight,
    serialize: serialize, deserialize: deserialize
  };
  if (typeof module !== 'undefined' && module.exports) { module.exports = api; }
  return api;
})();
</script>
  <script>
/*
 * ui.js - draws the screens and reacts to taps. All the rules live in game.js.
 *
 * Flow of a quest battle, like the original:
 *   Quests tab -> Enter -> party screen (pick your cards, leader first) ->
 *   Battle screen (animated, replays what game.js simulated) -> results screen.
 */
(function () {
  'use strict';

  var G = Game;
  var D = GameData;
  var A = Art;

  var state = null;
  var currentTab = 'quests';
  var cardSort = 'rarity';
  var fuseSel = [];            // card uids picked as fusion material
  var toastTimer = null;

  var party = [];              // card uids picked on the party screen
  var partyStage = null;       // stage id the party screen is for
  var battleRun = 0;           // bumped to cancel a battle replay that is still running
  var speed = 1;               // battle playback speed: 1, 2 or 4
  var skipping = false;
  var current = null;          // the battle result being replayed
  var freshGame = false;       // true when there was no save, so picking an alignment deals starter cards

  // ---------- saving / loading ----------
  function save() {
    try { localStorage.setItem(G.SAVE_KEY, G.serialize(state)); } catch (e) { /* private mode etc. */ }
  }
  function load() {
    try {
      var text = localStorage.getItem(G.SAVE_KEY);
      if (text) {
        var s = G.deserialize(text);
        if (s) { return s; }
      }
    } catch (e) { /* ignore */ }
    freshGame = true;
    return G.newGame();
  }

  // ---------- tiny helpers ----------
  function el(id) { return document.getElementById(id); }
  function icon(faction) {
    var f = D.FACTIONS[faction];
    return '<span class="fx" style="color:' + f.color + '">' + f.icon + '</span>';
  }
  function sleep(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }

  function toast(msg) {
    var t = el('toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2400);
  }

  function openModal(html) {
    el('modal').innerHTML = html;
    el('modal-backdrop').hidden = false;
  }
  function closeModal() { el('modal-backdrop').hidden = true; el('modal').innerHTML = ''; }

  function openScreen(html) { var s = el('screen'); s.innerHTML = html; s.hidden = false; }
  function closeScreen() {
    battleRun++;
    skipping = false;
    var s = el('screen');
    s.hidden = true;
    s.innerHTML = '';
    render();
  }

  // Custom art: assets/cards/<card-id>.png. We check once at startup which images
  // exist; cards without one keep the drawn placeholder (js/art.js).
  var artOk = {};
  function probeArt() {
    var pending = false;
    D.CARDS.forEach(function (c) {
      var img = new Image();
      img.onload = function () {
        artOk[c.id] = true;
        if (!pending) {
          pending = true;
          setTimeout(function () {
            pending = false;
            if (el('modal-backdrop').hidden && el('screen').hidden) { render(); }
          }, 50);
        }
      };
      img.src = 'assets/cards/' + c.id + '.png';
    });
  }
  function artFor(def) {
    return A.card(def) + (artOk[def.id] ? '<img src="assets/cards/' + def.id + '.png" alt="">' : '');
  }

  // attrs: extra attributes for the card's outer tag; extra: extra markup placed inside the card.
  function cardHtml(card, cls, attrs, extra) {
    var def = D.CARD_BY_ID[card.cardId];
    var st = G.cardStats(card);
    var stars = card.evo ? ' <span class="evo">' + new Array(card.evo + 1).join('★') + '</span>' : '';
    return '<div class="card r-' + def.rarity + ' ' + (cls || '') + '" ' + (attrs || '') + ' data-uid="' + card.uid + '">' +
      '<div class="art">' + artFor(def) + '</div>' +
      '<span class="rar">' + def.rarity + '</span>' +
      '<span class="lv">Lv' + card.level + stars + '</span>' + (extra || '') +
      '<div class="info"><div class="nm">' + icon(def.faction) + ' ' + def.name + '</div><div class="stat">ATK ' + st.atk + ' HP ' + st.hp + '</div></div></div>';
  }

  function sortedCards(cards, mode) {
    var order = D.RARITY_ORDER;
    var list = cards.slice();
    list.sort(function (a, b) {
      var da = D.CARD_BY_ID[a.cardId], db = D.CARD_BY_ID[b.cardId];
      if (mode === 'power') {
        var sa = G.cardStats(a), sb = G.cardStats(b);
        return (sb.atk + sb.hp / 4) - (sa.atk + sa.hp / 4) || b.uid - a.uid;
      }
      if (mode === 'level') { return (b.level + b.evo * 100) - (a.level + a.evo * 100) || b.uid - a.uid; }
      if (mode === 'recent') { return b.uid - a.uid; }
      if (mode === 'faction') {
        return D.FACTION_ORDER.indexOf(da.faction) - D.FACTION_ORDER.indexOf(db.faction) || order.indexOf(db.rarity) - order.indexOf(da.rarity);
      }
      var r = order.indexOf(db.rarity) - order.indexOf(da.rarity);
      return r || (b.level + b.evo * 100) - (a.level + a.evo * 100) || b.uid - a.uid;
    });
    return list;
  }

  // ---------- top bar ----------
  function renderTopbar() {
    G.regenStamina(state);
    var max = G.staminaCap(state);
    el('s-level').textContent = state.level;
    el('s-stamina').textContent = state.stamina + '/' + max;
    el('s-stamina-bar').style.width = Math.min(100, state.stamina / max * 100) + '%';
    el('s-gems').textContent = state.gems;
    el('s-gold').textContent = state.gold;
    var ms = G.msUntilNextStamina(state);
    el('s-stamina-timer').textContent = ms > 0 ? 'next +1 in ' + Math.ceil(ms / 1000) + 's' : 'full';
  }

  // ---------- tabs ----------
  function pips(done, total) {
    var s = '';
    for (var i = 0; i < total; i++) { s += i < done ? '●' : '○'; }
    return s;
  }

  function attrSummary() {
    var a = state.attr;
    return 'Stamina +' + (a.stamina * D.CONFIG.staminaPerPoint) + ' · ATK PWR +' + (a.atk * D.CONFIG.atkPctPerPoint) + '% · DEF PWR +' + (a.hp * D.CONFIG.hpPctPerPoint) + '%';
  }

  function renderQuests() {
    var need = G.expToNext(state.level);
    var html = '<h2>Quests</h2>' +
      '<div class="panel"><div class="row"><b>Level ' + state.level + '</b><span class="spacer"></span><span class="muted">' + state.exp + ' / ' + need + ' exp</span></div>' +
      '<div class="bar" style="height:7px;margin-top:6px"><div style="width:' + Math.min(100, state.exp / need * 100) + '%"></div></div></div>';

    if (state.attrPoints > 0) {
      html += '<div class="panel pts"><b>' + state.attrPoints + ' attribute point' + (state.attrPoints === 1 ? '' : 's') + ' to spend</b>' +
        '<div class="row wrap" style="margin-top:8px">' +
        '<button class="btn small" data-action="point" data-kind="stamina">Stamina +' + D.CONFIG.staminaPerPoint + '</button>' +
        '<button class="btn small" data-action="point" data-kind="atk">ATK PWR +' + D.CONFIG.atkPctPerPoint + '%</button>' +
        '<button class="btn small" data-action="point" data-kind="hp">DEF PWR +' + D.CONFIG.hpPctPerPoint + '%</button></div>' +
        '<div class="muted" style="margin-top:6px;font-size:12px">' + attrSummary() + '</div></div>';
    }
    if (state.items.cureWater > 0) {
      html += '<div class="panel row"><span><b>Cure Water x' + state.items.cureWater + '</b><br><span class="muted">Refills all your stamina</span></span><span class="spacer"></span>' +
        '<button class="btn small" data-action="curewater"' + (state.stamina >= G.staminaCap(state) ? ' disabled' : '') + '>Use</button></div>';
    }

    D.CHAPTERS.forEach(function (ch) {
      html += '<div class="chapter-title">Chapter ' + ch.id + ': ' + ch.name + ' <span class="muted" style="font-weight:400;font-size:13px">' + icon(ch.faction) + ' ' + D.FACTIONS[ch.faction].name + ' foes</span></div>';
      G.STAGES.filter(function (s) { return s.chapter === ch.id; }).forEach(function (s) {
        var unlocked = G.isUnlocked(state, s.id);
        var cleared = !!state.cleared[s.id];
        var foes = G.stageEnemies(s, G.nextFightNo(state, s.id));
        html += '<div class="stage' + (unlocked ? '' : ' locked') + '">' +
          '<div class="grow"><div class="name">' + s.id + (s.boss ? ' <span class="badge boss">BOSS</span>' : '') +
          (cleared ? ' <span class="cleared">Cleared</span>' : '') + '</div>' +
          '<div class="pips">' + pips(G.sectionProgress(state, s.id), s.monsters) + '</div>' +
          '<div class="muted">' + (s.boss ? 'Boss battle' : 'Monster ' + G.nextFightNo(state, s.id) + ' of ' + s.monsters) + ' \u00B7 ' + foes.length + ' foes \u00B7 ' + s.staminaCost + ' stamina</div></div>' +
          '<button class="btn small" data-action="enter" data-stage="' + s.id + '"' + (unlocked ? '' : ' disabled') + '>' + (s.boss ? 'Challenge' : 'Enter') + '</button></div>';
      });
    });
    return html;
  }

  function renderCards() {
    var html = '<h2>Cards (' + state.cards.length + ')</h2><div class="row"><span class="muted">Sort</span>' +
      '<select data-action="sort">';
    ['rarity', 'level', 'recent', 'faction'].forEach(function (m) {
      html += '<option value="' + m + '"' + (m === cardSort ? ' selected' : '') + '>' + m + '</option>';
    });
    html += '</select></div><h3>Tap a card to fuse, evolve or sell it</h3><div class="card-grid">';
    sortedCards(state.cards, cardSort).forEach(function (c) {
      html += cardHtml(c, '', 'data-action="card-open"');
    });
    return html + '</div>';
  }

  function renderDeck() {
    var cost = G.deckCost(state, state.deck);
    var cap = G.deckCostCap(state.level);
    var html = '<h2>Deck</h2><div class="row"><span>Cost <b class="' + (cost > cap ? 'cost-over' : 'cost-ok') + '">' + cost + ' / ' + cap + '</b></span>' +
      '<span class="spacer"></span><button class="btn small secondary" data-action="deck-clear">Clear</button>' +
      '<button class="btn small" data-action="deck-auto">Auto-fill</button></div>' +
      '<p class="muted" style="margin:6px 0">The first card is your leader (+20% ATK and HP). Tap ★ to make a card leader. You can also pick a different party before every battle.</p><div class="slots">';
    for (var i = 0; i < D.CONFIG.maxDeckSize; i++) {
      var c = state.deck[i] ? G.findCard(state, state.deck[i]) : null;
      html += '<div class="slot">' + (c ? cardHtml(c, '', 'data-action="deck-toggle"', i === 0 ? '<span class="lead">LEADER</span>' : '') +
        (i > 0 ? '<button class="star" data-action="deck-lead" data-uid="' + c.uid + '">★</button>' : '') : '+') + '</div>';
    }
    html += '</div><h3>Your cards (tap to add or remove)</h3><div class="card-grid">';
    sortedCards(state.cards, 'rarity').forEach(function (c) {
      var inDeck = state.deck.indexOf(c.uid) !== -1;
      html += cardHtml(c, inDeck ? 'selected' : '', 'data-action="deck-toggle"');
    });
    return html + '</div>';
  }

  function renderSummon() {
    var rates = G.rateTable();
    var html = '<h2>Summon</h2><div class="panel"><div class="row wrap">' +
      '<button class="btn" data-action="summon" data-count="1"' + (state.gems < D.CONFIG.singlePullCost ? ' disabled' : '') + '>Summon x1 (' + D.CONFIG.singlePullCost + ' gems)</button>' +
      '<button class="btn" data-action="summon" data-count="10"' + (state.gems < D.CONFIG.tenPullCost ? ' disabled' : '') + '>Summon x10 (' + D.CONFIG.tenPullCost + ' gems)</button></div>' +
      '<p class="muted">A x10 summon always includes at least one Super Rare or better.</p></div>' +
      '<h3>Rates</h3><table class="rates">';
    D.RARITY_ORDER.forEach(function (r) {
      html += '<tr><td>' + r + ' &ndash; ' + D.RARITIES[r].name + '</td><td>' + rates[r] + '%</td></tr>';
    });
    return html + '</table><p class="muted">Total summons: ' + state.pulls + '. Earn more gems by clearing sections for the first time and by levelling up.</p>';
  }

  function renderMore() {
    return '<h2>More</h2>' +
      '<div class="panel"><b>Your character</b><p class="muted" style="margin:6px 0 0">Alignment: ' + (state.alignment ? icon(state.alignment) + ' ' + D.FACTIONS[state.alignment].name : 'not chosen') +
      '<br>Level ' + state.level + ' \u00B7 ' + attrSummary() +
      '<br>Unspent attribute points: ' + state.attrPoints + ' (spend them on the Quests tab)</p></div>' +
      '<div class="panel"><b>Your own art</b><p class="muted">Every card has drawn placeholder art. To replace one, put an image named after the card id into <code>assets/cards/</code> (for example <code>assets/cards/ember-imp.png</code>) and reload. Card ids are listed in <code>js/data.js</code>.</p></div>' +
      '<div class="panel"><b>Save backup</b><p class="muted">Your game saves in this browser automatically. Copy the text below to back it up, or paste a backup and press Import.</p>' +
      '<textarea id="save-box" spellcheck="false"></textarea><div class="row wrap" style="margin-top:8px">' +
      '<button class="btn small secondary" data-action="export">Show my save</button>' +
      '<button class="btn small" data-action="import">Import</button></div></div>' +
      '<div class="panel"><b>Testing</b><div class="row wrap" style="margin-top:8px">' +
      '<button class="btn small secondary" data-action="gems">+1000 gems</button>' +
      '<button class="btn small secondary" data-action="gold">+5000 gold</button>' +
      '<button class="btn small secondary" data-action="stamina-fill">Fill stamina</button>' +
      '<button class="btn small secondary" data-action="align-open">Change alignment</button>' +
      '<button class="btn small danger" data-action="reset">Reset game</button></div></div>';
  }

  function render() {
    renderTopbar();
    var view = el('view');
    var scroll = view.scrollTop;
    var html = '';
    if (currentTab === 'quests') { html = renderQuests(); }
    else if (currentTab === 'cards') { html = renderCards(); }
    else if (currentTab === 'deck') { html = renderDeck(); }
    else if (currentTab === 'summon') { html = renderSummon(); }
    else { html = renderMore(); }
    view.innerHTML = html;
    view.scrollTop = scroll;
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) {
      b.classList.toggle('active', b.getAttribute('data-tab') === currentTab);
    });
  }

  // ---------- alignment picker (first launch, old saves, or "Change alignment") ----------
  function showAlignment() {
    var html = '<div class="sc-head"><h2>Choose your alignment</h2></div><div class="sc-body">' +
      '<p class="muted" style="margin-top:0">Cards of your alignment get +' + alignPct() + '% ATK and HP in battle. ' +
      'You can still use cards of any faction.' + (freshGame ? ' Your starting cards depend on your choice.' : '') + '</p>';
    D.FACTION_ORDER.forEach(function (fid) {
      var f = D.FACTIONS[fid];
      var showcase = D.CARDS.filter(function (c) { return c.faction === fid && c.rarity === 'SSR'; })[0];
      html += '<div class="panel align-pick" style="border-left:4px solid ' + f.color + '">' +
        '<div class="align-art"><div class="bu-card r-SSR"><div class="art">' + A.card(showcase) + '</div></div></div>' +
        '<div class="grow"><b style="font-size:17px">' + icon(fid) + ' ' + f.name + '</b>' +
        '<p class="muted" style="margin:4px 0 8px">' + f.blurb + '</p>' +
        (freshGame ? '<p class="muted" style="margin:0 0 8px;font-size:12px">Starts with: ' +
          D.CONFIG.starterCards[fid].map(function (id) { return D.CARD_BY_ID[id].name; }).join(', ') + '</p>' : '') +
        '<button class="btn" data-action="align-pick" data-f="' + fid + '">' + (state.alignment === fid ? 'Keep ' : 'Choose ') + f.name + '</button></div></div>';
    });
    openScreen(html + '</div>');
  }

  // ---------- party select screen ----------
  function foeHtml(u) {
    return '<div class="foe"><div class="bu-card r-' + (u.boss ? 'SSR' : 'R') + '"><div class="art">' + A.enemy(u) + '</div>' +
      '<span class="bu-el">' + icon(u.faction) + '</span><div class="bu-name">' + u.name + '</div></div></div>';
  }

  // Cards matching your alignment get a bonus; mark them with a green arrow.
  function advBadge(card) {
    return D.CARD_BY_ID[card.cardId].faction === state.alignment ? '<span class="adv up">\u25B2</span>' : '';
  }

  function alignPct() { return Math.round((D.CONFIG.alignmentBonus - 1) * 100); }

  function showParty(stageId, keep) {
    var info = G.battleInfo(state, stageId);
    if (!info.ok) { toast(info.error); return; }
    partyStage = stageId;
    if (!keep) { party = state.deck.slice(); }
    party = party.filter(function (u) { return !!G.findCard(state, u); });
    renderParty();
  }

  function renderParty() {
    G.regenStamina(state);
    var info = G.battleInfo(state, partyStage);
    var st = info.stage;
    var cost = G.deckCost(state, party);
    var cap = G.deckCostCap(state.level);
    var enough = state.stamina >= st.staminaCost;
    var ok = party.length > 0 && cost <= cap && enough;
    var team = G.buildTeam(state, party);
    var atk = team.reduce(function (s, u) { return s + u.atk; }, 0);
    var hp = team.reduce(function (s, u) { return s + u.maxHp; }, 0);
    var foeF = D.FACTIONS[info.enemies[0].faction];
    var myF = D.FACTIONS[state.alignment];
    var tip = 'These foes are ' + icon(info.enemies[0].faction) + ' ' + foeF.name + ' (' + foeF.blurb.split('.')[0].toLowerCase() + '). ' +
      'Your ' + icon(state.alignment) + ' ' + myF.name + ' cards get +' + alignPct() + '% ATK and HP (\u25B2).';
    var reason = !party.length ? 'Pick at least one card' : (cost > cap ? 'Party cost is over the limit' : (!enough ? 'Need ' + st.staminaCost + ' stamina (you have ' + state.stamina + ')' : ''));

    var html = '<div class="sc-head"><button class="btn small secondary" data-action="party-back">‹ Back</button>' +
      '<h2>' + (st.boss ? 'Chapter ' + st.chapter + ' boss' : 'Section ' + st.id + ' · Monster ' + info.fightNo + ' of ' + info.monsters) + '</h2></div>' +
      '<div class="sc-body"><h3 style="margin-top:0">Enemies</h3><div class="foes">' + info.enemies.map(foeHtml).join('') + '</div>' +
      '<p class="muted" style="text-align:center;margin:0 0 10px">' + tip + '</p>' +
      '<div class="row"><h3 style="margin:0">Your party</h3><span class="spacer"></span><span>Cost <b class="' + (cost > cap ? 'cost-over' : 'cost-ok') + '">' + cost + ' / ' + cap + '</b></span></div>' +
      '<div class="slots" style="margin-top:6px">';
    for (var i = 0; i < D.CONFIG.maxDeckSize; i++) {
      var c = party[i] ? G.findCard(state, party[i]) : null;
      html += '<div class="slot">' + (c ? cardHtml(c, '', 'data-action="party-toggle"', i === 0 ? '<span class="lead">LEADER</span>' : '') +
        (i > 0 ? '<button class="star" data-action="party-lead" data-uid="' + c.uid + '">★</button>' : '') : '+') + '</div>';
    }
    html += '</div><p class="muted" style="margin:4px 0 0">Party power: ATK ' + atk + ' · HP ' + hp + '. The first card is the leader (+20%). Tap a card to remove it, ★ to make it leader.</p>' +
      '<h3>Your cards</h3><div class="card-grid">';
    sortedCards(state.cards, 'power').forEach(function (cd) {
      var inP = party.indexOf(cd.uid) !== -1;
      html += cardHtml(cd, inP ? 'selected' : '', 'data-action="party-toggle"', advBadge(cd));
    });
    html += '</div></div><div class="sc-foot">' +
      '<button class="btn secondary" data-action="party-auto">Auto-fill</button>' +
      '<button class="btn big" data-action="party-go"' + (ok ? '' : ' disabled') + '>' + (ok ? 'Battle! (−' + st.staminaCost + ' stamina)' : reason) + '</button></div>';
    var body = el('screen').querySelector('.sc-body');
    var keepScroll = body ? body.scrollTop : 0;
    openScreen(html);
    el('screen').querySelector('.sc-body').scrollTop = keepScroll;
  }

  // ---------- battle screen ----------
  function unitHtml(u, side, i) {
    var svg = side === 'p' ? artFor(D.CARD_BY_ID[u.cardId]) : A.enemy(u);
    var rar = side === 'p' ? u.rarity : (u.boss ? 'SSR' : 'R');
    return '<div class="bu' + (u.boss ? ' boss' : '') + '" data-side="' + side + '" data-i="' + i + '">' +
      '<div class="bu-card r-' + rar + '"><div class="art">' + svg + '</div>' +
      '<span class="bu-el">' + icon(u.faction) + '</span>' + (u.leader ? '<span class="bu-lead">\u2605</span>' : '') +
      '<div class="bu-name">' + u.name + '</div></div>' +
      '<div class="hpbar"><i></i></div><div class="hpnum">' + u.hp + '</div></div>';
  }

  function unitEl(side, i) {
    return el('screen').querySelector('.bu[data-side="' + side + '"][data-i="' + i + '"]');
  }

  function setHp(side, i, hp) {
    var u = unitEl(side, i);
    if (!u) { return; }
    var list = side === 'p' ? current.units.player : current.units.enemy;
    var ratio = hp / list[i].maxHp;
    u.querySelector('.hpbar i').style.width = (ratio * 100) + '%';
    u.querySelector('.hpnum').textContent = hp;
    u.classList.toggle('mid', ratio < 0.6 && ratio >= 0.3);
    u.classList.toggle('low', ratio < 0.3);
    u.classList.toggle('dead', hp <= 0);
  }

  function updateSpeedButtons() {
    Array.prototype.forEach.call(el('screen').querySelectorAll('.b-top [data-action="speed"]'), function (b) {
      b.classList.toggle('on', parseInt(b.getAttribute('data-s'), 10) === speed);
    });
  }

  function spawnDamage(targetEl, e) {
    var field = el('screen').querySelector('.b-field');
    if (!field) { return; }
    var fr = field.getBoundingClientRect();
    var tr = targetEl.querySelector('.bu-card').getBoundingClientRect();
    var d = document.createElement('div');
    d.className = 'dmg' + (e.dead ? ' strong' : '');
    d.textContent = e.dmg;
    d.style.left = (tr.left - fr.left + tr.width / 2) + 'px';
    d.style.top = (tr.top - fr.top + tr.height / 2) + 'px';
    field.appendChild(d);
    setTimeout(function () { if (d.parentNode) { d.parentNode.removeChild(d); } }, 1000);
  }

  function startBattle(res) {
    battleRun++;
    var run = battleRun;
    skipping = false;
    current = res;
    var tint = D.FACTIONS[D.CHAPTERS[res.stage.chapter - 1].faction].color + '44';
    var html = '<div class="battle"><div class="b-top"><span class="round" id="b-round">Battle start</span>' +
      '<button data-action="speed" data-s="1">1x</button><button data-action="speed" data-s="2">2x</button>' +
      '<button data-action="speed" data-s="4">4x</button><button data-action="skip">Skip</button></div>' +
      '<div class="b-field" style="--field:' + tint + '">' +
      '<div class="b-row">' + res.units.enemy.map(function (u, i) { return unitHtml(u, 'e', i); }).join('') + '</div>' +
      '<div class="b-mid" id="b-mid">' + (res.stage.boss ? 'Boss battle' : 'Monster ' + res.fightNo + ' of ' + res.monsters) + '</div>' +
      '<div class="b-row">' + res.units.player.map(function (u, i) { return unitHtml(u, 'p', i); }).join('') + '</div></div>' +
      '<div class="b-log" id="b-log">&nbsp;</div></div>';
    openScreen(html);
    updateSpeedButtons();
    playBattle(res, run).then(function (finished) {
      if (!finished || run !== battleRun) { return; }
      setTimeout(function () { if (run === battleRun) { showResult(res); } }, skipping ? 150 : 700 / speed);
    });
  }

  // Replays the recorded hits one by one: lunge, flash, damage number, health bar.
  async function playBattle(res, run) {
    var ev = res.events;
    var names = { p: res.units.player, e: res.units.enemy };
    for (var k = 0; k < ev.length; k++) {
      if (run !== battleRun) { return false; }
      if (skipping) { break; }
      var e = ev[k];
      if (e.t === 'round') {
        el('b-round').textContent = 'Round ' + e.n;
        await sleep(300 / speed);
      } else if (e.t === 'hit') {
        var otherSide = e.side === 'p' ? 'e' : 'p';
        var from = unitEl(e.side, e.from), to = unitEl(otherSide, e.to);
        if (!from || !to) { continue; }
        var fc = from.querySelector('.bu-card');
        var fr = fc.getBoundingClientRect(), tr = to.querySelector('.bu-card').getBoundingClientRect();
        var dx = (tr.left + tr.width / 2) - (fr.left + fr.width / 2);
        var dy = (tr.top + tr.height / 2) - (fr.top + fr.height / 2);
        from.style.zIndex = 5;
        fc.style.transform = 'translate(' + (dx * 0.7) + 'px,' + (dy * 0.7) + 'px) scale(1.1)';
        el('b-log').textContent = names[e.side][e.from].name + ' hits ' + names[otherSide][e.to].name + ' for ' + e.dmg +
          (e.dead ? ' - defeated!' : '');
        await sleep(170 / speed);
        if (run !== battleRun) { return false; }
        to.classList.add('hit');
        spawnDamage(to, e);
        setHp(otherSide, e.to, e.hp);
        await sleep(300 / speed);
        to.classList.remove('hit');
        fc.style.transform = '';
        await sleep(150 / speed);
        from.style.zIndex = '';
      }
    }
    if (run !== battleRun) { return false; }
    if (skipping) {
      // Jump straight to the end: apply the last known health of every unit.
      var last = {};
      ev.forEach(function (x) { if (x.t === 'hit') { last[(x.side === 'p' ? 'e' : 'p') + x.to] = x.hp; } });
      Object.keys(last).forEach(function (key) { setHp(key.charAt(0), parseInt(key.slice(1), 10), last[key]); });
      Array.prototype.forEach.call(el('screen').querySelectorAll('.bu-card'), function (c) { c.style.transform = ''; });
    }
    el('b-round').textContent = res.win ? 'Victory!' : 'Defeat';
    return true;
  }

  // ---------- results screen ----------
  function chestSvg() {
    return '<svg viewBox="0 0 72 60" aria-hidden="true"><circle cx="36" cy="20" r="18" fill="#fff6c8" opacity=".35"/>' +
      '<rect x="6" y="28" width="60" height="28" rx="4" fill="#7a4a1d" stroke="#f0b429" stroke-width="3"/>' +
      '<path d="M6,28 Q36,2 66,28Z" fill="#9a5f26" stroke="#f0b429" stroke-width="3"/>' +
      '<rect x="31" y="30" width="10" height="12" rx="2" fill="#f0b429"/></svg>';
  }

  function showResult(res) {
    var st = res.stage;
    var next = G.STAGES[st.index + 1] || null;
    var html = '<div class="sc-head"><h2>' + (st.boss ? 'Chapter ' + st.chapter + ' boss' : 'Section ' + st.id) + '</h2></div><div class="sc-body">';
    var foot = '';

    if (!res.win) {
      html += '<div class="res-title result-lose">Defeat</div>' +
        '<div class="res-sub">Your party was wiped out. No stamina was spent.</div>' +
        '<div class="panel muted">Try a different party. Bring more cards of your alignment, level your cards up with Fuse, or spend your attribute points.</div>';
      foot = '<button class="btn secondary" data-action="res-quests">Quests</button>' +
        '<button class="btn" data-action="res-party">Change party</button>';
    } else {
      var r = res.rewards;
      html += '<div class="res-title result-win">Victory!</div><div class="res-sub">' +
        (r.sectionCleared ? (st.boss ? 'Boss defeated! Chapter cleared.' : 'Section cleared!') :
          (st.boss ? 'Boss defeated!' : 'Monster ' + res.fightNo + ' of ' + res.monsters + ' defeated')) +
        (st.boss ? '' : '<br><span class="pips">' + pips(res.fightNo, res.monsters) + '</span>') + '</div>';
      html += '<div class="panel"><div class="reward"><span>Experience</span><b>+' + r.exp + '</b></div>' +
        '<div class="reward"><span>Gold</span><b>+' + r.gold + '</b></div>' +
        (r.gems ? '<div class="reward"><span>Gems (first clear)</span><b>+' + r.gems + '</b></div>' : '') +
        (r.cureWater ? '<div class="reward"><span>Cure Water</span><b>+' + r.cureWater + '</b></div>' : '') + '</div>';
      if (r.levelsGained) {
        html += '<div class="levelup">Level up! You are now level ' + state.level + '.<br>+' + (r.levelsGained * D.CONFIG.pointsPerLevel) + ' attribute points. Stamina refilled.</div>';
      }
      if (r.chest) {
        html += '<div class="panel chest">' + chestSvg() + '<b>Treasure chest!</b>' +
          (r.chestGold ? '<div class="muted">+' + r.chestGold + ' gold</div>' : '') + '</div>';
      }
      if (r.cards.length) {
        html += '<h3 style="text-align:center">You found</h3><div class="found">' + r.cards.map(function (c) { return cardHtml(c); }).join('') + '</div>';
      }
      var again = (r.sectionCleared && next) ? 'res-next' : 'res-again';
      foot = '<button class="btn secondary" data-action="res-quests">Quests</button>' +
        '<button class="btn secondary" data-action="res-party">Change party</button>' +
        '<button class="btn" data-action="' + again + '">' + (again === 'res-next' ? 'Next section' : 'Fight again') + '</button>';
    }
    html += '</div><div class="sc-foot" style="flex-wrap:wrap">' + foot + '</div>';
    openScreen(html);
    render();
  }

  // ---------- modals ----------
  function showCardDetail(uid) {
    var card = G.findCard(state, uid);
    if (!card) { closeModal(); return; }
    var def = D.CARD_BY_ID[card.cardId];
    var st = G.cardStats(card);
    var inDeck = state.deck.indexOf(uid) !== -1;
    var html = '<div style="width:150px;margin:0 auto 10px">' + cardHtml(card) + '</div>' +
      '<h2 style="text-align:center">' + def.name + '</h2>' +
      '<p class="muted" style="text-align:center">' + icon(def.faction) + ' ' + D.FACTIONS[def.faction].name +
      (def.faction === state.alignment ? ' (your alignment, +' + alignPct() + '% in battle)' : '') +
      ' &middot; ' + D.RARITIES[def.rarity].name + ' &middot; cost ' + st.cost + (inDeck ? ' &middot; in deck' : '') + '</p>' +
      '<div class="panel">Level ' + card.level + ' / ' + st.maxLevel + (card.level < st.maxLevel ? ' &middot; exp ' + card.exp + ' / ' + G.cardExpToNext(card) : ' (max)') +
      '<br>Evolution ' + card.evo + ' / ' + D.CONFIG.maxEvo + '<br>ATK ' + st.atk + ' &middot; HP ' + st.hp + '</div>' +
      '<div class="row wrap">' +
      '<button class="btn" data-action="fuse-open" data-uid="' + uid + '">Fuse</button>' +
      '<button class="btn" data-action="evolve-open" data-uid="' + uid + '">Evolve</button>' +
      '<button class="btn danger" data-action="sell-card" data-uid="' + uid + '"' + (inDeck ? ' disabled' : '') + '>Sell (' + G.sellValue(card) + ' gold)</button>' +
      '<span class="spacer"></span><button class="btn secondary" data-action="close">Close</button></div>';
    openModal(html);
  }

  function showFuse(baseUid) {
    var base = G.findCard(state, baseUid);
    if (!base) { closeModal(); return; }
    fuseSel = fuseSel.filter(function (u) { return !!G.findCard(state, u); });
    var preview = G.fusePreview(state, baseUid, fuseSel);
    var html = '<h2>Fuse into ' + D.CARD_BY_ID[base.cardId].name + '</h2>' +
      '<p class="muted">Pick cards to use up. Cards of the same faction give ' + D.CONFIG.sameFactionFuseMult + 'x exp. Cards in your deck are hidden.</p>' +
      '<div class="panel">Gain <b>' + preview.exp + '</b> exp &middot; costs <b>' + preview.gold + '</b> gold (you have ' + state.gold + ')</div>' +
      '<div class="card-grid">';
    var mats = sortedCards(state.cards, 'rarity').filter(function (c) { return c.uid !== baseUid && state.deck.indexOf(c.uid) === -1; });
    mats.forEach(function (c) {
      html += cardHtml(c, fuseSel.indexOf(c.uid) !== -1 ? 'selected' : '', 'data-action="fuse-toggle" data-base="' + baseUid + '"');
    });
    if (!mats.length) { html += '<p class="muted">No spare cards. Clear quests or summon more.</p>'; }
    html += '</div><p class="row"><button class="btn" data-action="fuse-confirm" data-uid="' + baseUid + '"' + (fuseSel.length ? '' : ' disabled') + '>Fuse</button>' +
      '<button class="btn secondary" data-action="card-open" data-uid="' + baseUid + '">Back</button></p>';
    openModal(html);
  }

  function showEvolve(uid) {
    var card = G.findCard(state, uid);
    if (!card) { closeModal(); return; }
    var chk = G.canEvolve(state, uid);
    var html = '<h2>Evolve ' + D.CARD_BY_ID[card.cardId].name + '</h2>';
    if (!chk.ok) {
      html += '<p>' + chk.error + '</p>';
    } else {
      html += '<p class="muted">Uses up another copy of the same card (not in your deck) and ' + G.evolveCost(card) + ' gold. Raises the level cap by 10 and boosts stats by 30%.</p><div class="card-grid">';
      var copies = state.cards.filter(function (c) { return c.cardId === card.cardId && c.uid !== uid && state.deck.indexOf(c.uid) === -1; });
      copies.forEach(function (c) { html += cardHtml(c, '', 'data-action="evolve-pick" data-base="' + uid + '"'); });
      if (!copies.length) { html += '<p class="muted">You need a second copy of this card.</p>'; }
      html += '</div>';
    }
    html += '<p><button class="btn secondary" data-action="card-open" data-uid="' + uid + '">Back</button></p>';
    openModal(html);
  }

  function showSummonResults(cards) {
    var html = '<h2>Summon results</h2><div class="pull-results">';
    cards.forEach(function (c) { html += cardHtml(c); });
    html += '</div><div class="row"><button class="btn" data-action="close">Nice</button></div>';
    openModal(html);
  }

  function confirmModal(message, action) {
    openModal('<h2>Are you sure?</h2><p>' + message + '</p><div class="row">' +
      '<button class="btn danger" data-action="' + action + '">Yes</button>' +
      '<button class="btn secondary" data-action="close">Cancel</button></div>');
  }

  // ---------- actions ----------
  function act(name, node) {
    var uid = node.getAttribute('data-uid') ? parseInt(node.getAttribute('data-uid'), 10) : null;
    var res;
    switch (name) {
      case 'close': closeModal(); break;

      case 'align-open': showAlignment(); break;
      case 'align-pick': {
        var fid = node.getAttribute('data-f');
        if (freshGame) { state = G.newGame({ alignment: fid }); freshGame = false; }
        else { G.setAlignment(state, fid); }
        save(); closeScreen(); toast('You are ' + D.FACTIONS[fid].name + '.');
        break;
      }

      // quests and battles
      case 'enter': {
        var sid = node.getAttribute('data-stage');
        if (!G.isUnlocked(state, sid)) { toast('Clear the previous section first.'); break; }
        showParty(sid, false);
        break;
      }
      case 'party-back': closeScreen(); break;
      case 'party-toggle': {
        var pi = party.indexOf(uid);
        if (pi !== -1) { party.splice(pi, 1); }
        else if (party.length >= D.CONFIG.maxDeckSize) { toast('A party holds at most ' + D.CONFIG.maxDeckSize + ' cards.'); break; }
        else { party.push(uid); }
        renderParty();
        break;
      }
      case 'party-lead': {
        var li = party.indexOf(uid);
        if (li > 0) { party.splice(li, 1); party.unshift(uid); }
        renderParty();
        break;
      }
      case 'party-auto': party = G.bestDeck(state); renderParty(); break;
      case 'party-go':
        res = G.fight(state, partyStage, { deck: party });
        if (!res.ok) { toast(res.error); break; }
        save();
        startBattle(res);
        break;
      case 'speed': speed = parseInt(node.getAttribute('data-s'), 10); updateSpeedButtons(); break;
      case 'skip': skipping = true; break;
      case 'res-quests': closeScreen(); break;
      case 'res-party': showParty(current.stage.id, false); break;
      case 'res-next': showParty(G.STAGES[current.stage.index + 1].id, false); break;
      case 'res-again':
        res = G.fight(state, current.stage.id, {});
        if (!res.ok) { toast(res.error); break; }
        save();
        startBattle(res);
        break;
      case 'point':
        res = G.spendPoint(state, node.getAttribute('data-kind'));
        if (!res.ok) { toast(res.error); break; }
        save(); render();
        break;
      case 'curewater':
        res = G.useCureWater(state);
        if (!res.ok) { toast(res.error); break; }
        save(); render(); toast('Stamina refilled.');
        break;

      case 'sort': cardSort = node.value; render(); break;
      case 'card-open': showCardDetail(uid); break;

      // deck tab
      case 'deck-toggle': {
        var deck = state.deck.slice();
        var idx = deck.indexOf(uid);
        if (idx !== -1) { deck.splice(idx, 1); } else { deck.push(uid); }
        res = G.setDeck(state, deck);
        if (!res.ok) { toast(res.error); break; }
        save(); render();
        break;
      }
      case 'deck-lead': {
        var d2 = state.deck.slice();
        var j = d2.indexOf(uid);
        if (j > 0) { d2.splice(j, 1); d2.unshift(uid); G.setDeck(state, d2); save(); render(); }
        break;
      }
      case 'deck-clear': G.setDeck(state, []); save(); render(); break;
      case 'deck-auto': G.setDeck(state, G.bestDeck(state)); save(); render(); break;

      case 'summon': {
        res = G.summon(state, parseInt(node.getAttribute('data-count'), 10));
        if (!res.ok) { toast(res.error); break; }
        save(); render(); showSummonResults(res.cards);
        break;
      }

      case 'fuse-open': fuseSel = []; showFuse(uid); break;
      case 'fuse-toggle': {
        var i = fuseSel.indexOf(uid);
        if (i !== -1) { fuseSel.splice(i, 1); } else { fuseSel.push(uid); }
        showFuse(parseInt(node.getAttribute('data-base'), 10));
        break;
      }
      case 'fuse-confirm':
        res = G.fuse(state, uid, fuseSel.slice());
        if (!res.ok) { toast(res.error); break; }
        fuseSel = [];
        save(); render(); showCardDetail(uid);
        toast('+' + res.gained + ' exp' + (res.levelsGained ? ' (+' + res.levelsGained + ' levels)' : ''));
        break;

      case 'evolve-open': showEvolve(uid); break;
      case 'evolve-pick': {
        var baseUid = parseInt(node.getAttribute('data-base'), 10);
        res = G.evolve(state, baseUid, uid);
        if (!res.ok) { toast(res.error); break; }
        save(); render(); showCardDetail(baseUid); toast('Evolved!');
        break;
      }

      case 'sell-card':
        res = G.sell(state, [uid]);
        if (!res.ok) { toast(res.error); break; }
        save(); render(); closeModal(); toast('Sold for ' + res.gold + ' gold');
        break;

      // more tab
      case 'export': el('save-box').value = G.serialize(state); break;
      case 'import': {
        var s = G.deserialize(el('save-box').value);
        if (!s) { toast('That does not look like a valid save.'); break; }
        state = s; save(); render(); toast('Save imported.');
        break;
      }
      case 'gems': state.gems += 1000; save(); render(); break;
      case 'gold': state.gold += 5000; save(); render(); break;
      case 'stamina-fill': state.stamina = G.staminaCap(state); save(); render(); break;
      case 'reset': confirmModal('This deletes your whole game and starts over.', 'reset-confirm'); break;
      case 'reset-confirm': state = G.newGame(); freshGame = true; save(); closeModal(); render(); showAlignment(); break;
    }
  }

  // ---------- wiring ----------
  document.addEventListener('click', function (e) {
    var tab = e.target.closest ? e.target.closest('#tabs button') : null;
    if (tab) { currentTab = tab.getAttribute('data-tab'); render(); return; }
    if (e.target.id === 'modal-backdrop') { closeModal(); return; }
    var node = e.target.closest ? e.target.closest('[data-action]') : null;
    if (node && node.tagName !== 'SELECT' && !node.disabled) { act(node.getAttribute('data-action'), node); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.tagName === 'SELECT' && e.target.getAttribute('data-action')) {
      act(e.target.getAttribute('data-action'), e.target);
    }
  });

  state = load();
  G.regenStamina(state);
  render();
  if (!state.alignment) { showAlignment(); }
  probeArt();
  setInterval(renderTopbar, 1000);
  window.addEventListener('beforeunload', save);
  // Handy for debugging in the browser console.
  window.__game = { get state() { return state; } };
})();
</script>
</body>
</html>
